[package]
name = "scmess"
version = "0.1.0"
edition = "2021"

[dependencies]
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
aes-gcm = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = "0.4"
dirs = "5.0"
sha2 = "0.10"  # Добавляем для OAEP с SHA-256
