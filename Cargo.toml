[package]
name = "scmess"
version = "0.1.0"
edition = "2021"


[dependencies]
eframe = { version = "0.23", features = ["wgpu", "default_fonts"] }
winapi = { version = "0.3", features = ["winuser"] }
egui = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rsa = "0.7"
rand = "0.8"
aes-gcm = "0.10"
base64 = "0.13"
sha2 = "0.10"
chacha20 = "0.8"
pbkdf2 = "0.8"
hmac = "0.12"
chrono = "0.4"
rfd = "0.8"
dirs = "4.0"
pkcs8 = "0.9"



[build-dependencies]
qmetaobject = "0.2"
